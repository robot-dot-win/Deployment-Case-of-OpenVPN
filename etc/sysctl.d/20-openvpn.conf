# OpenVPN服务器Linux内核参数优化调整systemd-sysctl配置文件，2026.05.09
# 注：经Gemini优化
#
# 版权所有：Copyright (C) 2024, Martin Young <martin_young@live.cn>
#
# 测试环境：CentOS Stream 10，8G内存，禁用IPv6
# 文件路径：/etc/sysctl.d/20-openvpn.conf
#
# 适用场景：2000左右数量用户并发连接
#------------------------------------------------------------------------

# --- [1] 内存与系统水位 ---
vm.min_free_kbytes = 131072
vm.swappiness = 10

# --- [2] 基础网络转发与 ARP 优化 ---
net.ipv4.ip_forward = 1
# 优化多网卡下的 ARP 响应行为 (针对 VPN 路由环境)
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.all.rp_filter = 1

# --- [3] 处理“重连风暴”与队列 (针对 2000+ 并发) ---
# 提高接收队列上限
net.core.netdev_max_backlog = 10000
# 提高全连接与半连接队列，防止握手失败
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
# 防止 TIME_WAIT 耗尽
net.ipv4.tcp_max_tw_buckets = 81920
# 缩短建立连接时的重试次数
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3

# --- [4] 套接字缓冲区 (核心性能项) ---
# 必须给 UDP 留出足够的空间，防止丢包
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# 支持 TCP Fast Open (兼容模式)
net.ipv4.tcp_fastopen = 3
# 支持 TCP nodelay
net.ipv4.tcp_low_latency = 1

# --- [5] 邻居表优化 (防止 2000+ 设备导致条目溢出) ---
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv4.neigh.default.gc_stale_time = 120

# --- [6] 稳定性与丢包优化 (BBR 算法) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
# 对网络抖动的容忍度提高 (从默认 3 改为 5)
net.ipv4.tcp_reordering = 5

# --- [7] 连接保活与清理 ---
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_fin_timeout = 20
# 数据传输重试次数 (默认 15 太长，建议 8)
net.ipv4.tcp_retries2 = 8
